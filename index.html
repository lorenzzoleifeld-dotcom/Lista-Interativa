<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Interativa: Html Css e Javascript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Lista interativa</h1>
    <main>
    <div class="conteúdo">
    <input type="text" class="input" placeholder="Nome do novo elemento aqui">
    <button class="btn">Adicionar item a Lista</button>
    <ul id="lista">
        <header class="texto">Itens</header>
        <li class="fruta laranja">Laranja</li>
        <li class="fruta vermelha">Morango</li>
        <li class="fruta amarela">Pêssego</li>
    </ul>
    </div>
    </main>
    <hr>
    <section class="contato">
        <h2 class="subtitulo">Contato</h2>
    <footer>
    <div class="redes-sociais">
        <h2>Contato Social</h2>
        <p class="youtube">Youtube: <a href="https://www.youtube.com/@ocaradospace"> ocaradospace</a></p>
        <p class="tiktok">Tiktok: <a href="tiktok.com/@ocaradospace"> ocaradospace</a></p>
    </div>
    </footer>
    </section>
    <script src="index.js"></script>

</body>
</html>
